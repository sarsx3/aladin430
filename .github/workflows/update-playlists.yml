name: Update M3U Playlists

on:
  # প্রতি ৩০ মিনিটে নিজে নিজে চলবে
  schedule:
    - cron: "*/30 * * * *"
  # হাতে চালানোর বাটন (Actions ট্যাব -> Run workflow)
  workflow_dispatch:
  # sources.json বা স্ক্রিপ্ট বদলালে সাথে সাথে চলবে
  push:
    paths:
      - "sources.json"
      - "scripts/**"
      - ".github/workflows/update-playlists.yml"

permissions:
  contents: write

# একসাথে দুইটা রান যেন ধাক্কা না খায়
concurrency:
  group: update-playlists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pycryptodome

      - name: Generate playlists
        id: gen
        run: python scripts/generate_playlists.py
        env:
          # Gist API-তে রেট-লিমিট এড়াতে (ক্যাশ-মুক্ত সর্বশেষ ডেটা আনার জন্য)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # একটা সোর্স ফেল করলেও বাকিগুলো কমিট হবে

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists

          if git diff --cached --quiet; then
            # কিছু বদলায়নি। তবে ৪৫ দিন কমিট না হলে GitHub স্কেজিউল বন্ধ করে দেয়,
            # তাই এমন হলে একটা keepalive কমিট দিয়ে দেবে।
            last=$(git log -1 --format=%ct)
            now=$(date +%s)
            if [ $((now - last)) -gt $((45 * 86400)) ]; then
              git commit --allow-empty -m "chore: keepalive"
            else
              echo "কোনো পরিবর্তন নেই।"
            fi
          else
            git commit -m "chore: update playlists $(date -u +'%Y-%m-%d %H:%M UTC')"
          fi

          # পুশ ফেল করলে ৫ বার চেষ্টা। আগে ৩ বার ফেল করলেও স্টেপ "সফল" দেখাত;
          # এখন সব চেষ্টা ব্যর্থ হলে রান লাল হবে, যাতে নীরবে আপডেট হারিয়ে না যায়।
          branch="${GITHUB_REF_NAME:-main}"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then
              pushed=1
              break
            fi
            echo "পুশ চেষ্টা $i/5 ব্যর্থ, আবার চেষ্টা হবে..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::পুশ ব্যর্থ হয়েছে"
            exit 1
          fi

      - name: Mark run as failed if any source failed
        if: steps.gen.outcome == 'failure'
        run: |
          echo "এক বা একাধিক সোর্স ব্যর্থ হয়েছে, লগ দেখুন।"
          exit 1
